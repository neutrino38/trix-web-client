<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trix — exemple minimal</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; max-width: 40rem; margin: 1rem auto; padding: 0 1rem; }
      fieldset { margin: 0 0 1rem; }
      label { display: block; margin: 0.3rem 0; }
      input, select, textarea { font: inherit; }
      .suspect { outline: 2px solid crimson; }
      .error { color: crimson; }
      .muted { color: gray; }
      .bubble.us { text-align: right; }
      textarea { width: 100%; }
      /* ?double: two instances side by side, stacked on a narrow screen */
      body:has(#app.double) { max-width: 80rem; }
      .double { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 2rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
