<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trix — exemple minimal</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; max-width: 40rem; margin: 1rem auto; padding: 0 1rem; }
      fieldset { margin: 0 0 1rem; }
      label { display: block; margin: 0.3rem 0; }
      input, select, textarea { font: inherit; }
      .suspect { outline: 2px solid crimson; }
      .error { color: crimson; }
      .muted { color: gray; }
      .bubble.us { text-align: right; }
      textarea { width: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- outside #app: rebuilding the screen must not cut the call's sound -->
    <audio id="remote" autoplay></audio>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
