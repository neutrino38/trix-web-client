<!doctype html>
<!-- `lang` de départ, remplacé par src/i18n dès le chargement selon la langue
     choisie (ou celle du navigateur) : ce qui compte ici est qu'un lecteur
     d'écran ait une langue à annoncer avant même que le script ne tourne. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- La CSP de production est posée par le serveur : voir
       docs/utilisation/deploiement.md. -->
  <title>Trix Communicator</title>
  <!-- Le favicon est aussi un canal d'alerte : ui/alert.ts le remplace par une
       pastille clignotante à l'appel entrant, puis restaure celui-ci. -->
  <link rel="icon" href="/trix-favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/trix-favicon-192.png">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
