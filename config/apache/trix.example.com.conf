# Apache 2.4 vhost serving the built Trix client (dist/) over TLS.
# Required modules: mod_ssl, mod_headers, mod_deflate, mod_dir, mod_alias
# (mod_http2 for h2).
# Deployment steps: docs/utilisation/deploiement-apache.md

<VirtualHost *:80>
    ServerName trix.example.com

    Redirect permanent / https://trix.example.com/

    ErrorLog  /var/log/httpd/trix.example.com-error.log
    CustomLog /var/log/httpd/trix.example.com-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName trix.example.com
    DocumentRoot /var/www/trix
    DirectoryIndex index.html

    Protocols h2 http/1.1

    SSLEngine on
    # The certificate file holds the leaf certificate then the intermediates.
    SSLCertificateFile    /etc/pki/tls/certs/trix.example.com-fullchain.crt
    SSLCertificateKeyFile /etc/pki/tls/private/trix.example.com.key

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    Header always set Strict-Transport-Security "max-age=63072000"
    # style-src allows inline styles: the UI templates carry style attributes.
    Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; media-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)"

    <Directory /var/www/trix>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    <Files "index.html">
        Header always set Cache-Control "no-cache"
    </Files>

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml

    ErrorLog  /var/log/httpd/trix.example.com-ssl-error.log
    CustomLog /var/log/httpd/trix.example.com-ssl-access.log combined
</VirtualHost>
