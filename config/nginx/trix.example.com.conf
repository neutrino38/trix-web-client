# nginx server blocks serving the built Trix client (dist/) over TLS.
# Drop in an http context (/etc/nginx/conf.d/), the map needs it.
# Deployment steps: docs/utilisation/deploiement.md

# Hashed asset filenames make the file immutable; index.html must never be cached.
map $uri $trix_cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name trix.example.com;

    return 301 https://trix.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trix.example.com;

    root /var/www/trix;
    index index.html;

    # The certificate file holds the leaf certificate then the intermediates.
    ssl_certificate     /etc/pki/tls/certs/trix.example.com-fullchain.crt;
    ssl_certificate_key /etc/pki/tls/private/trix.example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:trix_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    # style-src allows inline styles: the UI templates carry style attributes.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; media-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    add_header Cache-Control $trix_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/trix.example.com-access.log;
    error_log  /var/log/nginx/trix.example.com-error.log;
}
